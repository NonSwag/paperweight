name: Deploy
on:
  push:
    tags: [ 'v*' ]

# The Gradle build published releases to the Gradle Plugin Portal (publishPlugins). jpm has no Plugin Portal
# publishing, so a release builds the plugin jars and attaches them to the GitHub release; publish them to the
# Portal by hand, or to a Maven repository with `jpm run publish <url>`.
jobs:
  deploy:
    name: Deploy
    runs-on: namespace-profile-linux-default
    permissions:
      contents: write
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v9
      - name: Set up cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            ~/.jpm/repository
            ~/.jpm/jdks
            ~/.jpm/gradle
      - name: Install jpm
        run: |
          curl -fsSL https://github.com/java-package-manager/jpm/releases/latest/download/install.sh | sh
          echo "$HOME/.jpm/bin" >> "$GITHUB_PATH"
      - name: Build the plugin jars
        run: jpm build
      - name: Parse tag
        id: vars
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Create release and changelog
        uses: MC-Machinations/auto-release-changelog@v1.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: paperweight ${{ steps.vars.outputs.tag }}
      - name: Attach the plugin jars
        run: gh release upload "${{ steps.vars.outputs.tag }}" paperweight-core/dist/*-bundle.jar paperweight-userdev/dist/*-bundle.jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
