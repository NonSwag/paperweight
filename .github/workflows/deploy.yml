name: Deploy
on:
  push:
    tags: [ 'v*' ]

# A release builds the plugin jars and attaches them to the GitHub release. jpm does not publish to the Gradle
# Plugin Portal: publish them there by hand, or to a Maven repository with `jpm run publish <url>`.
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: java-package-manager/setup-jpm@1
        with:
          # the newest build of jpm's main branch: Kotlin, gradle:api and ext: dependencies are not released yet
          version: canary
      - name: Cache the Gradle distribution the plugins build against
        uses: actions/cache@v4
        with:
          path: ${{ env.JPM_HOME }}/gradle
          key: jpm-gradle-${{ runner.os }}-${{ hashFiles('project.lock') }}
          restore-keys: jpm-gradle-${{ runner.os }}-
      - name: Build the plugin jars
        run: jpm build
      - name: Parse tag
        id: vars
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Create release and changelog
        uses: MC-Machinations/auto-release-changelog@v1.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: paperweight ${{ steps.vars.outputs.tag }}
      - name: Attach the plugin jars
        run: gh release upload "${{ steps.vars.outputs.tag }}" paperweight-core/dist/*-bundle.jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
