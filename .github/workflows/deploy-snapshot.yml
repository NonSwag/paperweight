name: Deploy Snapshot
on:
  push:
    branches: [ 'main' ]
    paths-ignore:
      - 'license/*'
      - 'readme.md'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'

jobs:
  deploy:
    name: Deploy Snapshot
    runs-on: namespace-profile-linux-default
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v9
      - name: Set up cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            ~/.jpm/repository
            ~/.jpm/jdks
            ~/.jpm/gradle
      - name: Install jpm
        run: |
          curl -fsSL https://github.com/java-package-manager/jpm/releases/latest/download/install.sh | sh
          echo "$HOME/.jpm/bin" >> "$GITHUB_PATH"
      - name: Get project version
        id: get_version
        shell: bash
        run: |
          project_version=$(jpm info --json | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')
          echo version=$project_version >> $GITHUB_OUTPUT
      - name: Deploy snapshot version
        if: endsWith(steps.get_version.outputs.version, '-SNAPSHOT')
        run: jpm run publish https://artifactory.papermc.io/artifactory/snapshots/
        env:
          JPM_PUBLISH_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          JPM_PUBLISH_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
