name: Test
on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  test:
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    name: Test
    runs-on: namespace-profile-linux-default
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v9
      - name: Set up cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          # jpm's downloads: Maven packages, JDKs and the Gradle distribution the plugins build against
          path: |
            ~/.jpm/repository
            ~/.jpm/jdks
            ~/.jpm/gradle
      - name: Install jpm
        run: |
          curl -fsSL https://github.com/java-package-manager/jpm/releases/latest/download/install.sh | sh
          echo "$HOME/.jpm/bin" >> "$GITHUB_PATH"
      - name: Check the lockfile
        run: jpm install --frozen
      - name: Lint
        run: jpm run lint
      - name: Build
        run: jpm build
      - name: Test
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "GitHub Actions"
          jpm test
