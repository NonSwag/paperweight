name: Test
on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  test:
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    name: Test
    runs-on: namespace-profile-linux-default
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v9
      - uses: java-package-manager/setup-jpm@1
      - name: Cache the Gradle distribution the plugins build against
        uses: actions/cache@v4
        with:
          path: ${{ env.JPM_HOME }}/gradle
          key: jpm-gradle-${{ runner.os }}-${{ hashFiles('project.lock') }}
          restore-keys: jpm-gradle-${{ runner.os }}-
      - name: Check the lockfile
        run: jpm install --frozen
      - name: Lint
        run: jpm run lint
      - name: Build
        run: jpm build
      - name: Test
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "GitHub Actions"
          jpm test
